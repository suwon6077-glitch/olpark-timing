name: 실시간 주차대수 수집

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python olpark_collect.py realtime --once --out data/realtime_parking.csv
      - name: 저장소에 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/realtime_parking.csv
          git commit -m "realtime $(TZ=Asia/Seoul date +'%F %T')" || exit 0
          git pull --rebase && git push

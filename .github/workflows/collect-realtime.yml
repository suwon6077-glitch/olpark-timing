name: 실시간 주차대수 수집

# 한 번 실행하면 5시간 40분 동안 5분 간격으로 수집하고,
# 끝날 때 자기 자신을 다시 실행해서 계속 이어진다.
# 멈추려면: Actions → 실시간 주차대수 수집 → 오른쪽 ... → Disable workflow
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # 예비용 (체인이 끊겼을 때 다시 살림)

permissions:
  contents: write
  actions: write

concurrency:
  group: realtime
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: 5분 간격 수집 (약 5시간 40분)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          end=$((SECONDS + 340*60))
          while [ $SECONDS -lt $end ]; do
            python olpark_collect.py realtime --once --out data/realtime_parking.csv || true
            git add data/realtime_parking.csv
            git commit -qm "realtime $(TZ=Asia/Seoul date +'%F %T')" || true
            git pull -q --rebase && git push -q || echo "push 실패, 다음 회차에 재시도"
            sleep 300
          done

      - name: 다음 실행 예약 (자기 자신 다시 실행)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect-realtime.yml --ref ${{ github.ref_name }}
